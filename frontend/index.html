<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Weave: your next step, without opening five apps</title>
  <meta name="description" content="Ask Weave about your day. It checks your calendar, notes and to-dos, gives you one clear answer, and asks before it changes anything." />
  <meta name="theme-color" content="#fbfbfa" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="preload" href="/fonts/parkinsans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
  <script>document.documentElement.classList.add('js');</script>
  <script>
    (function () {
      var d = document.documentElement;
      try {
        if (location.pathname === '/' && !sessionStorage.getItem('weave-seen') && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
          d.classList.add('is-intro');
          setTimeout(function () { d.classList.add('is-intro-done'); }, 1500);
        }
        sessionStorage.setItem('weave-seen', '1');
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <noscript><p style="padding:24px;font-family:system-ui,sans-serif">Weave needs JavaScript enabled to run.</p></noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
